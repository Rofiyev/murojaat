plugins { id 'com.android.application' }

android {
    namespace 'uz.buxoro.hospital'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'uz.buxoro.hospital'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
