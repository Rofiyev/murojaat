name: Import Hospital Production

on:
  push:
    paths:
      - '.deploy/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/overlay /tmp/base
          cat .deploy/overlay_*.b64 | base64 -d > /tmp/overlay.tar.gz
          echo 'b3d839764340991df4a709dc0570338c69655ba1bbe2d66fa680527950d6e2c6  /tmp/overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/overlay.tar.gz -C /tmp/overlay
          git clone --depth 1 https://github.com/hamzaezzine/Hospital-Management.git /tmp/base
          rm -rf /tmp/base/.git /tmp/base/db.sqlite3 /tmp/base/media /tmp/base/assets /tmp/base/__pycache__
          find /tmp/base -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/base/. .
          cp -a /tmp/overlay/. .
          mkdir -p mobile-android/app/src/main/res/drawable
          cp static/img/icon_app.png mobile-android/app/src/main/res/drawable/app_icon.png
          rm -rf .deploy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create clean Vercel database
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          export SECRET_KEY='temporary-build-key-only'
          export DEBUG='True'
          rm -f db.sqlite3 vercel_db.sqlite3
          python manage.py migrate --noinput
          python manage.py loaddata seed/categories.json
          python manage.py loaddata seed/specialities.json
          python manage.py loaddata seed/status.json
          python manage.py loaddata seed/time.json
          mv db.sqlite3 vercel_db.sqlite3

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-hospital.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f vercel_db.sqlite3
          git commit -m 'Replace Murojaat with Hospital Management production'
          git push origin HEAD:main
