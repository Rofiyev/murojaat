<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075985"><title>Boshliq paneli — Buxoro Tibbiyot Tizimi</title><link rel="icon" href="/assets/icon_app.png"><link rel="stylesheet" href="/assets/app.css?v=3.1.0"></head><body>
<section id="loginView" class="auth-page"><main class="login-card"><img class="login-logo" src="/assets/icon_app.png" alt=""><h1>Boshliq paneli</h1><p class="muted">Murojaatlarni boshqarish uchun tizimga kiring.</p><form id="loginForm"><input id="login" autocomplete="username" placeholder="Login" required><input id="password" type="password" autocomplete="current-password" placeholder="Parol" required><button class="btn primary" type="submit">Kirish</button></form><p id="loginError" class="muted"></p><a class="login-back" href="/">← Bosh sahifa</a></main></section>
<div id="dashView" class="admin" hidden><header class="admin-top"><div class="shell admin-nav"><a class="brand" href="/"><img src="/assets/icon_app.png" alt=""><span><strong>Buxoro Tibbiyot Tizimi</strong><small>Boshliq paneli</small></span></a><button id="logout" class="btn ghost" type="button">Chiqish</button></div></header><main class="shell admin-main">
<div class="admin-title"><div><span class="eyebrow dark">BOSHQARUV VA NAZORAT</span><h1>Murojaatlar</h1><label class="auto-refresh"><input id="autoRefresh" type="checkbox" checked> 30 soniyada avtomatik yangilash</label></div><button id="refresh" class="btn secondary">Yangilash</button></div>
<div class="stats"><div class="stat"><span>Jami</span><b id="sAll">0</b></div><div class="stat"><span>Yangi</span><b id="sNew">0</b></div><div class="stat"><span>Jarayonda</span><b id="sProgress">0</b></div><div class="stat"><span>Hal qilingan</span><b id="sDone">0</b></div><div class="stat"><span>Yordam</span><b id="sHelp">0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Nazorat raqami, F.I.Sh., telefon, muassasa yoki mazmun..."><select id="institutionFilter"><option value="">Barcha muassasalar</option></select><select id="filter"><option value="">Barcha holatlar</option><option value="yangi">Yangi</option><option value="jarayonda">Jarayonda</option><option value="hal_qilindi">Hal qilingan</option><option value="rad_etildi">Rad etilgan</option><option value="audio">Ovozli</option><option value="help">Yordam</option></select><button id="csv" class="btn secondary">CSV yuklash</button></div>
<div class="table-wrap"><table class="admin-table"><thead><tr><th>Nazorat</th><th>Bemor</th><th>Muassasa</th><th>Shifokor</th><th>Murojaat mazmuni</th><th>Holat</th><th>Sana</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="institution-manage"><h2>Muassasalar</h2><form id="institutionForm" class="institution-form"><input id="institutionName" placeholder="Muassasa nomi" required><button class="btn primary">Muassasa qo‘shish</button></form><div id="institutionAdminList" class="institution-list-admin"></div></section>
<section class="doctor-manage"><h2>Shifokorlar</h2><form id="doctorForm" class="doctor-form"><select id="doctorInstitution" required><option value="">Muassasani tanlang</option></select><input id="doctorName" placeholder="F.I.Sh." required><input id="doctorSpecialty" placeholder="Mutaxassislik" required><button class="btn primary">Qo‘shish</button></form><div id="doctorAdminList" class="doctor-list-admin"></div></section>
</main></div>
<div id="detailModal" class="modal"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="detailBody"></div></div></div>
<script src="/boshliq/boshliq.js?v=3.1.0" defer></script></body></html>
